# --- general behaviour ---
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
exec-on-workspace-change = ["/bin/bash", "-c",
"sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE"
]

# --- gaps ---
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

# --- floating app exceptions ---
[[on-window-detected]]
if.app-id = "com.apple.systempreferences"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.finder"
if.window-title-regex-substring = "Copy|Move|Info|Delete"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.calculator"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.ActivityMonitor"
run = "layout floating"

# --- keybindings (main mode) ---
[mode.main.binding]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"

# send focused window to a workspace, and then follow it
alt-shift-1 = "move-node-to-workspace 1 --focus-follows-window"
alt-shift-2 = "move-node-to-workspace 2 --focus-follows-window"
alt-shift-3 = "move-node-to-workspace 3 --focus-follows-window"
alt-shift-4 = "move-node-to-workspace 4 --focus-follows-window"
alt-shift-5 = "move-node-to-workspace 5 --focus-follows-window"

alt-f = "fullscreen"
alt-shift-c = "reload-config"
alt-equal = "balance-sizes"
alt-shift-space = "layout floating tiling"  # toggle current window float/tile
alt-slash = "layout tiles horizontal vertical"  # toggle split orientation
alt-r = "mode resize"  # enter the resize submode
alt-shift-w = "exec-and-forget $HOME/.dotfiles/scripts/wallpaper-shuffle-trigger.sh"

# --- keybindings (resize submode) ---
# a separate mode where hjkl resize instead of focus while it's active
# press alt-r to enter, enter/esc to leave
[mode.resize.binding]
h = "resize width -50"
j = "resize height -50"
k = "resize height +50"
l = "resize width +50"
enter = "mode main"
esc = "mode main"

